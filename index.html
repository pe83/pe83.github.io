<script>
const canvas = document.getElementById('electric');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const COLORS = ['#00d2ff', '#ff3366', '#00B08E', '#0070d1', '#FFE94D', '#FF69F8', '#9d4dff'];
let bolts = [];

// Jagged line using midpoint displacement
function jag(x1, y1, x2, y2, d) {
  if (d < 4) return [[x1, y1, x2, y2]];
  const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * d;
  const my = (y1 + y2) / 2 + (Math.random() - 0.5) * d;
  return [...jag(x1, y1, mx, my, d / 2), ...jag(mx, my, x2, y2, d / 2)];
}

const MAX_BOLTS = 3;

function spawnBolt() {
  if (document.hidden || bolts.length >= MAX_BOLTS) return;  // no pile-up
  const W = canvas.width, H = canvas.height;
  const x1 = Math.random() * W, y1 = -10;
  const x2 = x1 + (Math.random() - 0.5) * W * 0.5;
  const y2 = H * (0.4 + Math.random() * 0.6);
  const len = Math.hypot(x2 - x1, y2 - y1);

  const main = jag(x1, y1, x2, y2, len * 0.3);
  const branches = [];
  main.forEach(s => {
    if (Math.random() < 0.09) {
      const ang = Math.atan2(y2 - y1, x2 - x1) + (Math.random() - 0.5) * 1.6;
      const bl = 80 + Math.random() * 180;
      branches.push(jag(s[2], s[3], s[2] + Math.cos(ang) * bl, s[3] + Math.sin(ang) * bl, bl * 0.4));
    }
  });

  bolts.push({
    main, branches,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    life: 0,
    max: 14 + Math.random() * 16
  });
}

function drawSegs(segs, color, scale, alpha) {
  const passes = [
    { w: 8, a: 0.20, c: color },     // wide soft glow
    { w: 3, a: 0.60, c: color },     // colored body
    { w: 1.2, a: 1.00, c: '#ffffff' } // white-hot core
  ];
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  passes.forEach(p => {
    ctx.strokeStyle = p.c;
    ctx.shadowColor = color;
    ctx.shadowBlur = 22;
    ctx.lineWidth = p.w * scale;
    ctx.globalAlpha = p.a * alpha;
    ctx.beginPath();
    segs.forEach(s => { ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); });
    ctx.stroke();
  });
}

function frame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  bolts = bolts.filter(b => b.life < b.max);
  bolts.forEach(b => {
    const fade = 1 - b.life / b.max;
    const flicker = Math.random() < 0.3 ? 0.35 : 1;   // electric flicker
    const alpha = fade * flicker;

    // brief screen flash when the bolt strikes
    if (b.life < 2) {
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.06;
      ctx.fillStyle = b.color;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    drawSegs(b.main, b.color, 1, alpha);
    b.branches.forEach(br => drawSegs(br, b.color, 0.5, alpha));
    b.life++;
  });

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  requestAnimationFrame(frame);
}

// random strikes, sometimes double
(function schedule() {
  spawnBolt();
  if (Math.random() < 0.3) setTimeout(spawnBolt, 80);
  setTimeout(schedule, 600 + Math.random() * 1800);
})();
// when leaving the page, throw away old bolts so none are waiting when you return
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    bolts = [];
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
});
frame();
</script>
